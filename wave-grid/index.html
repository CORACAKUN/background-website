<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive wave grid that ripples beneath your cursor."
    />
    <title>Wave Grid</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="wave-grid" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <main>
      <div class="eyebrow"><span></span>Surface study 04</div>
      <h1>Make some<br /><em>waves.</em></h1>
      <p>
        Glide across the surface to bend its geometry. Click or tap anywhere
        to send a deeper pulse through the field.
      </p>
    </main>

    <div class="depth-meter" aria-hidden="true">
      <span>Amplitude</span>
      <div><i id="meter-fill"></i></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
