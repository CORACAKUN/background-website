<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive gravity well that bends particles around your cursor."
    />
    <title>Gravity Well</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="gravity-field" aria-hidden="true"></canvas>

    <main>
      <div class="eyebrow"><span></span>Orbital simulation</div>
      <h1>Bend the<br /><em>universe.</em></h1>
      <p>
        Your cursor carries mass. Move slowly to gather passing matter, or
        sweep across the field to send particles into curved trajectories.
      </p>
    </main>

    <div class="legend" aria-hidden="true">
      <span><i class="legend-core"></i>Gravity core</span>
      <span><i class="legend-orbit"></i>Orbital radius</span>
    </div>

    <script src="../trace-toggle.js"></script><script src="script.js"></script>
  </body>
</html>
