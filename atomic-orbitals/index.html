<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An interactive atomic background with orbiting electrons and energized bonds."
    />
    <title>Atomic Orbitals</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="atoms" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <main>
      <small>MOLECULAR FIELD 43</small>
      <h1>Split the<br /><em>atom.</em></h1>
      <p>
        Drift through a charged atomic field. Move to pull electrons into
        brighter orbits, then click to release a quantum pulse.
      </p>
    </main>

    <div class="hint">CLICK TO IONIZE</div>

    <script src="../trace-toggle.js"></script>
    <script src="script.js"></script>
  </body>
</html>
