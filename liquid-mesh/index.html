  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive liquid gradient mesh that flows around your cursor."
    />
    <title>Liquid Mesh</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="liquid-mesh" aria-hidden="true"></canvas>

      <h1>Shape the<br /><em>current.</em></h1>

    <div class="flow-status" aria-hidden="true">
      <span>Flow</span>
      <i></i><i></i><i></i><i></i>
    </div>
