<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An interactive nuclear fission background with splitting nuclei and chain reactions."
    />
    <title>Nuclear Fission</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="fission" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <main>
      <small>CHAIN REACTION 44</small>
      <h1>Break the<br /><em>nucleus.</em></h1>
      <p>
        Unstable particles drift through the field. Move to bend their path,
        then click to split a nucleus into a branching reaction.
      </p>
    </main>

    <div class="hint">CLICK TO SPLIT</div>

    <script src="../../../trace-toggle.js"></script>
    <script src="script.js"></script>
  </body>
</html>
