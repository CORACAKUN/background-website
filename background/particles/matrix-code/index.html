<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An interactive Matrix-style code rain background with cascading glyphs and scanlines."
    />
    <title>Matrix Code</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="matrix" aria-hidden="true"></canvas>
    <div class="scanlines" aria-hidden="true"></div>

    <main>
      <small>SYSTEM STREAM 47</small>
      <h1>Enter the<br /><em>matrix.</em></h1>
      <p>
        Cascading symbols fall through a dark terminal field. Move to bend the
        stream and click to inject a bright data pulse.
      </p>
    </main>

    <div class="status">WAKE SIGNAL ACTIVE</div>

    <script src="../../../../../trace-toggle.js"></script>
    <script src="script.js"></script>
  </body>
</html>
