<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A cinematic network monitor background with animated terminals, packet streams, binary signals, and live graphs."
    />
    <title>Network Monitor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="network" aria-hidden="true"></canvas>
    <div class="scan" aria-hidden="true"></div>

    <main class="console-grid">
      <section class="hero-terminal">
        <div class="terminal-bar">
          <span></span>
          <span></span>
          <span></span>
          <b>node@fields:~/signals</b>
        </div>
        <div class="terminal-body" id="main-log"></div>
      </section>

      <aside class="side-stack">
        <section class="panel">
          <div class="panel-head">
            <span>Entropy</span>
            <b id="entropy-value">0x00</b>
          </div>
          <div class="hash-stream" id="hash-stream"></div>
        </section>

        <section class="panel compact">
          <div class="panel-head">
            <span>Packet Graph</span>
            <b id="packet-rate">000 mb/s</b>
          </div>
          <div class="bars" id="bars"></div>
        </section>
      </aside>

      <section class="code-panel">
        <div class="panel-head">
          <span>Generated Signal</span>
          <b>read-only simulation</b>
        </div>
        <pre id="code-feed"></pre>
      </section>

      <section class="binary-panel">
        <div class="panel-head">
          <span>Binary Diff</span>
          <b id="diff-count">0000</b>
        </div>
        <div id="binary-grid"></div>
      </section>
    </main>

    <div class="identity">
      <small>SIMULATION 48</small>
      <strong>Network Monitor</strong>
    </div>

    <script src="../../../../../trace-toggle.js"></script>
    <script src="script.js"></script>
  </body>
</html>
