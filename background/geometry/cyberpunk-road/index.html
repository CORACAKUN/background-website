<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An endless neon cyberpunk highway racing toward a distant city."
    />
    <title>Cyberpunk Road</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="highway" aria-hidden="true"></canvas>
    <div class="scanlines" aria-hidden="true"></div>

    <main>
      <div class="eyebrow"><span></span>Night drive 43</div>
      <h1>Chase the<br /><em>horizon.</em></h1>
      <p>
        An endless road through the electric night. Move to steer the camera
        and press anywhere to engage overdrive.
      </p>
    </main>

    <aside class="drive-status" aria-hidden="true">
      <div><span>Velocity</span><strong id="speed">186 KM/H</strong></div>
      <i></i>
      <div><span>Destination</span><strong>∞</strong></div>
    </aside>

    <div class="boost-hint" aria-hidden="true">Hold — Overdrive</div>

    <script src="../../../../../trace-toggle.js"></script>
    <script src="script.js"></script>
  </body>
</html>
