<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive tactical radar with moving contacts and live sweep detection."
    />
    <title>Radar System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="radar" aria-hidden="true"></canvas>
    <div class="screen-noise" aria-hidden="true"></div>

    <main>
      <div class="eyebrow"><span></span>Surveillance array 49</div>
      <h1>Nothing goes<br /><em>undetected.</em></h1>
      <p>
        A live tactical sweep tracking movement across the field. Move to
        inspect coordinates and click inside the radar to place a waypoint.
      </p>
    </main>

    <aside class="radar-status" aria-hidden="true">
      <div><span>Contacts</span><strong id="contact-count">08 active</strong></div>
      <i></i>
      <div><span>Range</span><strong>480 KM</strong></div>
      <i></i>
      <div><span>Sweep</span><strong id="sweep-status">Online</strong></div>
    </aside>

    <div class="coordinates" aria-hidden="true">
      <span id="bearing">BRG 000°</span>
      <span id="distance">DST 000 KM</span>
    </div>

    <script src="script.js"></script>
  </body>
</html>
