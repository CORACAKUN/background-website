<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An interactive nuclear fusion background with plasma streams and merging nuclei."
    />
    <title>Nuclear Fusion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="fusion" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <main>
      <small>STELLAR CORE 45</small>
      <h1>Fuse the<br /><em>light.</em></h1>
      <p>
        Charged nuclei spiral into a hot core. Move to steer the plasma and
        click to compress the field into a brief stellar flare.
      </p>
    </main>

    <div class="hint">CLICK TO COMPRESS</div>

    <script src="../../../trace-toggle.js"></script>
    <script src="script.js"></script>
  </body>
</html>
