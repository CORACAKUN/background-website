<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An interactive explosion background with shockwaves, sparks, and pressure ripples."
    />
    <title>Shockwave Explosion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="explosion" aria-hidden="true"></canvas>
    <div class="heat-haze" aria-hidden="true"></div>

    <main>
      <small>PRESSURE WAVE 46</small>
      <h1>Start the<br /><em>blast.</em></h1>
      <p>
        Sparks drift through a heated field. Move to bend the smoke and click
        to release a bright shockwave across the canvas.
      </p>
    </main>

    <div class="hint">CLICK TO DETONATE</div>

    <script src="../../../../../trace-toggle.js"></script>
    <script src="script.js"></script>
  </body>
</html>
