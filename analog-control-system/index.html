<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive analog control system with mechanical gauges and live signals."
    />
    <title>Analog Control System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="console" aria-hidden="true"></canvas>
    <div class="glass" aria-hidden="true"></div>

    <main>
      <div class="eyebrow"><span></span>Control deck 50</div>
      <h1>Take full<br /><em>control.</em></h1>
      <p>
        A complete analog-digital command panel. Toggle systems, press
        controls, drag the power lever, and keep the gyro level.
      </p>
    </main>

    <aside class="console-status" aria-hidden="true">
      <div><span>System</span><strong id="system-state">Standby</strong></div>
      <i></i>
      <div><span>Control</span><strong id="signal-status">Manual</strong></div>
    </aside>

    <script src="script.js"></script>
  </body>
</html>
